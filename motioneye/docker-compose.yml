version: '3.8'

services:
  motioneye:
    image: ${MOTIONEYE_IMAGE_NAME}
    container_name: ${MOTIONEYE_CONTAINER_NAME}
    ports:
      - "8765:8765"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - ${MOTIONEYE_CONFIG_DIR}:/etc/motioneye
      - ${MOTIONEYE_VIDEO_DIR}:/var/lib/motioneye
    restart: always
    stdin_open: true
    tty: true
