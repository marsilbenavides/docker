version: '3.8'

services:
  motioneye:
    image: motioneye-img
    container_name: motioneye
    ports:
      - "8765:8765"
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/user/motioneye/config:/etc/motioneye
      - /home/user/motioneye/videos:/var/lib/motioneye
    restart: always
    stdin_open: true
    tty: true
